<!doctype html>
<html lang="fa" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>دسترسی منصفانه به یادگیری | LangBlue</title>
<meta name="description" content="درخواست داوطلبانه تخفیف اجتماعی LangBlue برای سنین ۱۰ تا ۶۹ سال">
<link rel="stylesheet" href="../assets/css/langblue-theme.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/supabase-client.js"></script>
<script type="module">
import React,{useEffect,useState}from"https://esm.sh/react@18.3.1";
import{createRoot}from"https://esm.sh/react-dom@18.3.1/client";
const h=React.createElement;
function App(){
 const [session,S]=useState(null),[loading,L]=useState(true),[age,A]=useState(""),[note,N]=useState(""),[status,T]=useState(null),[message,M]=useState(""),[busy,B]=useState(false);
 const client=window.LangBlueSupabase?.getClient?.();
 useEffect(()=>{document.body.classList.add("lb-social");if(!client){M("اتصال حساب آماده نیست؛ صفحه را از وب‌سایت LangBlue باز کنید.");L(false);return}client.auth.getSession().then(({data})=>{S(data.session);L(false)});const{data:{subscription}}=client.auth.onAuthStateChange((_e,s)=>S(s));return()=>subscription.unsubscribe()},[]);
 async function invoke(payload){if(!client)throw Error("اتصال حساب آماده نیست");const{data,error}=await client.functions.invoke("langblue-community-access",{body:payload});if(error||!data?.ok)throw Error(({AUTH_REQUIRED:"ابتدا وارد حساب LangBlue شوید.",AGE_NOT_ELIGIBLE:"این برنامه فقط برای سنین ۱۰ تا ۶۹ سال است."})[data?.error]||data?.error||error?.message||"خطا در ارتباط با سرور");return data}
 async function refresh(){try{const d=await invoke({action:"status"});T(d.request)}catch(e){M(e.message)}}
 useEffect(()=>{if(session)refresh()},[session]);
 async function submit(e){e.preventDefault();const website=String(e.currentTarget.elements.website?.value||"");B(true);M("");try{await invoke({action:"submit",age:Number(age),note,website});await refresh();M("درخواست ثبت شد؛ نتیجه پس از بررسی مدیر نمایش داده می‌شود.")}catch(e){M(e.message)}finally{B(false)}}
 const expiry=status?.discount_expires_at?new Date(status.discount_expires_at).toLocaleDateString("fa-IR"):"";
 const statusText=!status?"هنوز درخواستی ثبت نشده است.":status.status==="pending"?"درخواست در انتظار بررسی است.":status.discount_active?"تخفیف فعال است و تا "+expiry+" اعتبار دارد.":status.status==="approved"?"اعتبار تخفیف پایان یافته است؛ برای تمدید دوباره درخواست بدهید.":"درخواست قبلی رد شده است؛ می‌توانید دوباره درخواست دهید.";
 return h("main",{className:"lb-wrap"},
  h("div",{className:"lb-brand"},"🌿 LangBlue · دسترسی منصفانه"),
  h("section",{className:"lb-card"},
   h("div",{className:"lb-meta"},"عدالت اجتماعی · فرصت برابر · احترام به کرامت انسانی"),
   h("h1",null,"دسترسی منصفانه به یادگیری"),
   h("p",null,"هر کاربر ۱۰ تا ۶۹ سال می‌تواند داوطلبانه درخواست تخفیف اجتماعی کند. معیار اقتصادی برای همه یکسان است؛ نیازی به مدرک درآمد، عکس، فیلم یا اطلاعات زیستی نیست. در صورت تأیید، تخفیف اجتماعی ۱۰٪ به مدت شش ماه فعال می‌شود. اگر هر پنج محصول را با پلن ۱۲ماهه انتخاب کنید، تخفیف بستهٔ ۱۰٪ نیز جداگانه قابل جمع است؛ دو تخفیف به‌صورت پیاپی محاسبه می‌شوند."),
   loading?h("div",{className:"lb-status"},"در حال بررسی حساب…"):!session?h("div",{className:"lb-status error"},"برای ثبت یا مشاهدهٔ درخواست ابتدا وارد حساب مرکزی LangBlue شوید و سپس این صفحه را دوباره باز کنید."):h(React.Fragment,null,
    h("div",{className:"lb-status",role:"status"},statusText),
    (!status||status.status==="rejected"||(!status.discount_active&&status.status==="approved"))?h("form",{onSubmit:submit},
      h("label",null,"سن (سال؛ فقط برای بررسی شرط سنی)"),
      h("input",{type:"number",min:10,max:69,step:1,required:true,value:age,onChange:e=>A(e.target.value),placeholder:"سن بین ۱۰ تا ۶۹"}),
      h("label",null,"پیام اختیاری"),
      h("textarea",{value:note,onChange:e=>N(e.target.value),maxLength:500,placeholder:"اگر نکته‌ای برای درخواست دارید، اینجا بنویسید."}),
      h("div",{className:"lb-hidden","aria-hidden":"true"},h("label",null,"وب‌سایت"),h("input",{name:"website",tabIndex:-1,autoComplete:"off"})),
      h("p",{className:"lb-small"},"سن اعلام‌شده فقط برای بررسی شرط واجدشرایط بودن ذخیره می‌شود. وضعیت مالی خود را لازم نیست توضیح دهید."),
      h("button",{type:"submit",disabled:busy||!age},busy?"در حال ثبت…":"ثبت درخواست تخفیف اجتماعی ۱۰٪")
    ):null,
    h("div",{className:"lb-row",style:{marginTop:14}},h("button",{className:"secondary",onClick:refresh},"به‌روزرسانی وضعیت"),h("a",{className:"lb-button",href:"../index.html"},"بازگشت به LangBlue"))
   ),
   message?h("div",{className:"lb-status error",role:"status"},message):null
  )
 );
}
createRoot(document.getElementById("app")).render(h(App));
</script><link rel="stylesheet" href="../assets/css/langblue-design-system.css">
</head><body class="lb-social lb-design-system"><div id="app"><main class="lb-wrap">در حال بارگذاری…</main></div></body></html>
