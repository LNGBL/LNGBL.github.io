<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#205C43"><title>فهرست معلمان | LangBlue</title><meta name="description" content="مشاهدهٔ پروفایل معلمان فعال و تأییدشده و پیشنهادهای کلاس در شبکهٔ LangBlue."><link rel="stylesheet" href="../assets/css/langblue-theme.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/supabase-client.js"></script>
<style>body{background:#14251d;color:#f4ebdd}.wrap{width:min(1080px,calc(100% - 28px));margin:28px auto 70px}.head,.teacher-card{padding:20px;border:1px solid rgba(244,235,221,.15);border-radius:17px;background:rgba(14,38,27,.82);margin-bottom:14px}.eyebrow{color:#86b99a;font-weight:800;font-size:12px}h1{font-size:clamp(28px,5vw,42px);margin:6px 0 10px}.muted{color:#c7d5c9;font-size:13px;line-height:1.9}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.btn{display:inline-flex;padding:10px 14px;border-radius:10px;background:#205c43;color:#fff;text-decoration:none;font-weight:750;border:1px solid rgba(134,185,154,.25)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}.teacher-card{margin:0}.teacher-card h2{margin:0 0 6px;font-size:21px}.portrait{width:82px;height:82px;border-radius:50%;object-fit:cover;border:2px solid #86b99a;background:#203a2d}.offer{padding:12px;margin-top:10px;border-radius:12px;background:rgba(134,185,154,.07);border:1px solid rgba(134,185,154,.16)}.offer h3{margin:0 0 4px;font-size:16px}.empty{padding:26px;text-align:center;border:1px dashed rgba(244,235,221,.22);border-radius:14px;color:#c7d5c9}.status{padding:12px;border-radius:10px;background:rgba(134,185,154,.08);margin-top:12px;font-size:13px}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}</style></head>
<body><main class="wrap">
<section class="head"><div class="eyebrow">LANGBLUE · VERIFIED TEACHERS</div><h1>فهرست معلمان و کلاس‌ها</h1><p class="muted">فقط پروفایل‌های فعال و تأییدشده و پیشنهادهای کلاسِ باز در این فهرست نمایش داده می‌شوند. اطلاعات خصوصی حساب‌ها نمایش داده نمی‌شود.</p><div class="actions"><a class="btn" href="/pages/teacher-network.html">پنل معلمان</a><a class="btn" href="/">صفحهٔ اصلی LangBlue</a></div><div id="directoryStatus" class="status" role="status">در حال بارگذاری فهرست…</div></section>
<section id="directory" class="grid"></section>
</main>
<script>
(function(){
'use strict';
const status=document.getElementById('directoryStatus'),root=document.getElementById('directory');
const areaNames={grammar:'Grammar',vocabulary:'Vocabulary',deutsch:'Deutsch',japanese:'Japanese',langdesert_arabic:'LangDesert Arabic'};
function el(tag,cls,txt){const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}
function safeHref(value){try{const u=new URL(value);return u.protocol==='https:'?u.href:null}catch(_){return null}}
function render(profiles,offers){root.replaceChildren();if(!profiles.length){root.append(el('div','empty','هنوز پروفایل عمومیِ تأییدشده‌ای منتشر نشده است. معلمان می‌توانند از «پنل معلمان» درخواست پروفایل ثبت کنند.'));return}
const offerMap=new Map();offers.forEach(o=>{if(!offerMap.has(o.teacher_id))offerMap.set(o.teacher_id,[]);offerMap.get(o.teacher_id).push(o)});
profiles.forEach(p=>{const card=el('article','teacher-card','');const top=el('div','','');top.style.cssText='display:flex;align-items:center;gap:14px;margin-bottom:12px';const src=safeHref(p.portrait_url||'');if(src){const img=el('img','portrait','');img.src=src;img.alt='تصویر پروفایل '+(p.display_name||'معلم');img.loading='lazy';top.append(img)}const info=el('div','','');info.append(el('h2','',p.display_name||'معلم LangBlue'));info.append(el('span','muted','پروفایل فعال و تأییدشده'));top.append(info);card.append(top);if(p.bio)card.append(el('p','muted',p.bio));if(p.qualifications)card.append(el('p','muted','تجربه و صلاحیت: '+p.qualifications));if(Array.isArray(p.languages)&&p.languages.length)card.append(el('p','muted','زبان‌های تدریس: '+p.languages.join('، ')));if(Array.isArray(p.product_areas)&&p.product_areas.length)card.append(el('p','muted','حوزه‌ها: '+p.product_areas.map(x=>areaNames[x]||x).join(' · ')));if(p.age)card.append(el('p','muted','سن: '+Number(p.age).toLocaleString('fa-IR')));if(p.referral_code)card.append(el('p','muted','کد معرفی معلم: '+p.referral_code));const own=offerMap.get(p.user_id)||[];if(own.length){card.append(el('h3','','پیشنهادهای کلاس'));own.forEach(o=>{const box=el('div','offer','');box.append(el('h3','',o.title));if(o.description)box.append(el('p','muted',o.description));box.append(el('p','muted',(areaNames[o.product_area]||o.product_area)+' · '+Number(o.price_irt||0).toLocaleString('fa-IR')+' تومان · '+(o.price_basis==='whole_group'?'برای کل گروه':'برای هر زبان‌آموز')+(o.capacity?' · ظرفیت '+o.capacity:'')));card.append(box)})}else card.append(el('p','muted','در حال حاضر کلاس بازی برای این معلم ثبت نشده است.'));root.append(card)})
}
async function init(){const sb=window.LangBlueSupabase?.getClient?.();if(!sb){status.textContent='اتصال به فهرست در دسترس نیست؛ لطفاً صفحه را دوباره بارگذاری کن.';return}const [p,o]=await Promise.all([sb.from('teacher_public_directory').select('*').order('display_name'),sb.from('teacher_class_offers').select('id,teacher_id,title,description,product_area,price_irt,price_basis,capacity').eq('status','open').order('created_at',{ascending:false})]);if(p.error||o.error){status.textContent='فهرست فعلاً بارگذاری نشد. لطفاً بعداً دوباره امتحان کن.';return}status.textContent='فهرست به‌روز شد · '+Number(p.data?.length||0).toLocaleString('fa-IR')+' پروفایل';render(p.data||[],o.data||[])}
init();
})();
</script></body></html>
