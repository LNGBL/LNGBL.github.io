name: Python AI Engine

on:
  push:
    paths:
      - "ai-engine/**"
      - ".github/workflows/python-ai-engine.yml"
  pull_request:
    paths:
      - "ai-engine/**"
      - ".github/workflows/python-ai-engine.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-engine/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q
