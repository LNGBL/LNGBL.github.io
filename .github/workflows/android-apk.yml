name: Build LangBlue Android APK
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: ["android/**",".github/workflows/android-apk.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build release APK
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon
      - name: Publish direct-download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: LangBlue Android ${{ github.run_number }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
