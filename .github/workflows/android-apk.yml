name: Build LangBlue Android Debug APK
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
permissions:
  contents: read
jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build debug APK (no release signing)
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Stage debug APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/LangBlue-Android-1.0.5-debug.apk
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LangBlue-Android-1.0.5-debug
          path: dist/LangBlue-Android-1.0.5-debug.apk
          if-no-files-found: error
          retention-days: 14
