name: Build Signed LangBlue Android Release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      LANGBLUE_KEYSTORE_PASSWORD: ${{ secrets.LANGBLUE_KEYSTORE_PASSWORD }}
      LANGBLUE_KEY_ALIAS: ${{ secrets.LANGBLUE_KEY_ALIAS }}
      LANGBLUE_KEY_PASSWORD: ${{ secrets.LANGBLUE_KEY_PASSWORD }}
      LANGBLUE_KEYSTORE_PATH: app/langblue-release.jks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Validate signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.LANGBLUE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$LANGBLUE_KEYSTORE_PASSWORD" ] || [ -z "$LANGBLUE_KEY_ALIAS" ] || [ -z "$LANGBLUE_KEY_PASSWORD" ]; then
            echo "::error::Configure LANGBLUE_KEYSTORE_BASE64, LANGBLUE_KEYSTORE_PASSWORD, LANGBLUE_KEY_ALIAS and LANGBLUE_KEY_PASSWORD in repository Actions secrets before publishing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/langblue-release.jks
          test -s android/app/langblue-release.jks
      - name: Build signed release APK
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon
      - name: Verify APK signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          apksigner verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" dist/LangBlue-Android-1.0.5.apk
      - name: Publish signed release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.5
          name: LangBlue Android 1.0.5
          generate_release_notes: true
          files: dist/LangBlue-Android-1.0.5.apk
          fail_on_unmatched_files: true
