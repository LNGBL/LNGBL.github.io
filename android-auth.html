<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LangBlue · اتصال اپ</title></head><body style="font-family:system-ui;max-width:620px;margin:50px auto;padding:20px;line-height:2"><h1>🔷 اتصال LangBlue Android</h1><p id="status">در حال بررسی حساب مرورگر…</p><button id="connect" hidden style="padding:12px 18px">اتصال این حساب به اپ</button><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js?v=20261008"></script><script>
const status=document.getElementById('status'),btn=document.getElementById('connect');
(async()=>{
 const sb=window.LangBlueSupabase?.getClient?.();
 if(!sb){status.textContent='اتصال Supabase آماده نیست.';return}
 const {data}=await sb.auth.getSession();
 if(!data?.session){status.innerHTML='ابتدا در LangBlue وارد حساب شو؛ سپس این صفحه را دوباره باز کن.';return}
 status.textContent='حساب مرورگر پیدا شد. برای ادامه دکمه زیر را بزن.';btn.hidden=false;
 btn.onclick=async()=>{
  btn.disabled=true;status.textContent='در حال ساخت اتصال امن…';
  const {data,error}=await sb.functions.invoke('langblue-android-handoff',{body:{action:'create_session'}});
  if(error||!data?.ok){status.textContent='اتصال ساخته نشد؛ دوباره تلاش کن.';btn.disabled=false;return}
  location.href='langblue://auth?token='+encodeURIComponent(data.token);
 };
})();
</script></body></html>
