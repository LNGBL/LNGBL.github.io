<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LangBlue Kurmancî</title>

<style>

body{
font-family:tahoma,Arial;
background:#07111f;
color:white;
margin:0;
}

.wrap{
max-width:1100px;
margin:auto;
padding:30px;
}

.card{
background:#102235;
padding:25px;
border-radius:20px;
margin-bottom:25px;
}

h1,h2{
color:#7dd3fc;
}

input,select{
width:100%;
padding:12px;
margin:8px 0;
background:#1e344d;
border:none;
border-radius:10px;
color:white;
}

button{
padding:12px 20px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
cursor:pointer;
}

button:disabled{
background:#475569;
}

table{
width:100%;
border-collapse:collapse;
}

td,th{
padding:12px;
border-bottom:1px solid #334155;
text-align:center;
}

th{
background:#1e3a5f;
}

.lock{
background:#422006;
color:#fde68a;
padding:12px;
border-radius:10px;
display:none;
}

.badge{
background:#0ea5e9;
padding:5px 10px;
border-radius:20px;
}

.flash{
background:#162d46;
padding:30px;
border-radius:20px;
text-align:center;
font-size:22px;
}

</style>

</head>


<body>


<div class="wrap">


<div class="card">

<h1>
🟦 LangBlue Kurmancî
</h1>

<p>
سیستم مدیریت و یادگیری زبان کرمانجی
</p>

</div>




<div class="card">

<h2>
🔐 حساب مرکزی
</h2>

<div id="accountStatus"></div>

</div>





<div class="card">


<h2>
➕ افزودن واژه
</h2>


<div id="accountWarning" class="lock">

🔒 برای افزودن داده باید وارد حساب مرکزی شوید.

</div>



<input id="kWord"
placeholder="کلمه کرمانجی">



<input id="faWord"
placeholder="معنی فارسی">



<select id="type">

<option value="noun">
اسم
</option>

<option value="verb">
فعل
</option>

<option value="adjective">
صفت
</option>

<option value="other">
سایر
</option>

</select>



<button id="addButton" onclick="addWord()">

ثبت واژه

</button>


</div>







<div class="card">

<h2>
📚 واژگان
</h2>


<input id="search"
placeholder="جستجو..."
oninput="renderTable()">



<table>

<thead>

<tr>

<th>
کرمانجی
</th>

<th>
فارسی
</th>

<th>
نوع
</th>

<th>
فونتیک
</th>

<th>
صوت
</th>

<th>
سطح
</th>

<th>
عملیات
</th>

</tr>

</thead>


<tbody id="table">

</tbody>


</table>


</div>






<div class="card">

<h2>
🧠 SRS
</h2>


<div id="flash" class="flash">

مرور شروع نشده

</div>


<br>


<button onclick="review()">

واژه بعدی

</button>


</div>




</div>





<script src="langblue-core.js"></script>


<script>


const LANG="kurmanci";


let database=[];



// =======================
// Core Load
// =======================


function load(){


database =
LangBlueCore.database.words(LANG)
||
[];


}




// =======================
// Account
// =======================


function account(){


let ok =
LangBlueCore.hasPermission();



let status =
document.getElementById(
"accountStatus"
);



let warning =
document.getElementById(
"accountWarning"
);



let btn =
document.getElementById(
"addButton"
);



if(ok){


status.innerHTML=
`
<span class="badge">
🟢 فعال
</span>
<br>
ویرایش داده فعال است.
`;

warning.style.display="none";

btn.disabled=false;


}

else{


status.innerHTML=
`
<span class="badge">
👤 مهمان
</span>
<br>
فقط مشاهده فعال است.
`;

warning.style.display="block";

btn.disabled=true;


}


}





// =======================
// Auto Language Engine
// =======================


function generateData(word){


return {


phonetic:
"/"+word+"/",



audio:function(){


let u =
new SpeechSynthesisUtterance(word);

u.lang="ku";

speechSynthesis.speak(u);


},



level:
detectLevel(word),



srs:0



};


}





function detectLevel(word){


if(word.length<=3)
return "A1";


if(word.length<=6)
return "A2";


return "B1";


}






// =======================
// Add
// =======================


function addWord(){



if(!LangBlueCore.hasPermission()){

alert(
"حساب مرکزی لازم است."
);

return;

}



let k =
document.getElementById("kWord").value.trim();



let fa =
document.getElementById("faWord").value.trim();



let type =
document.getElementById("type").value;



if(!k||!fa)
return;



let auto =
generateData(k);



let word={


kurmanci:k,


persian:fa,


type:type,


phonetic:auto.phonetic,


audio:true,


level:auto.level,


srs:auto.srs,


created:Date.now()


};




LangBlueCore.database.add(
LANG,
word
);



load();

renderTable();



}







// =======================
// Table
// =======================


function renderTable(){


let box =
document.getElementById("table");



let q =
document.getElementById("search")
.value
.toLowerCase();



box.innerHTML="";



database
.filter(w=>

w.kurmanci.toLowerCase().includes(q)
||
w.persian.toLowerCase().includes(q)

)
.forEach(w=>{


box.innerHTML+=`

<tr>

<td>${w.kurmanci}</td>

<td>${w.persian}</td>

<td>${w.type}</td>

<td>${w.phonetic}</td>


<td>

<button onclick="speak('${w.kurmanci}')">

🔊

</button>

</td>


<td>
${w.level}
</td>


<td>


<button onclick="removeWord(${w.id})">

🗑

</button>


</td>


</tr>

`;



});


}








// =======================
// Audio
// =======================


function speak(text){


let u =
new SpeechSynthesisUtterance(text);


u.lang="ku";


speechSynthesis.speak(u);


}






// =======================
// Delete
// =======================


function removeWord(id){



if(!LangBlueCore.hasPermission())
return;



LangBlueCore.database.delete(
LANG,
id
);



load();

renderTable();


}








// =======================
// SRS
// =======================


function review(){


if(!database.length)
return;



let w =
database[
Math.floor(
Math.random()*database.length
)
];



document.getElementById("flash")
.innerHTML=

`

<b>
${w.kurmanci}
</b>

<br><br>

${w.persian}

<br>

${w.level}

`;



}







window.addEventListener(
"storage",
function(){

load();

renderTable();

account();

});



load();

renderTable();

account();



</script>


</body>

</html>
