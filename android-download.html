<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دانلود LangBlue Android</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#0b1220;color:#eef5ff;display:grid;place-items:center;min-height:100vh;margin:0;padding:16px;box-sizing:border-box}
    .card{max-width:540px;padding:28px;border:1px solid #263b5d;border-radius:24px;background:#121d30;text-align:center}
    .logo{width:64px;height:64px;display:block;margin:0 auto 14px}
    .note{color:#bdcbe0;line-height:1.8}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/favicon.svg" alt="LangBlue">
    <h1>دانلود LangBlue برای اندروید</h1>
    <p>نسخهٔ آزمایشی Debug — نسخهٔ 1.0.5</p>
    <p class="note">دانلود نسخهٔ اندروید در حال حاضر غیرفعال است.</p>
  </main>
</body>
</html>
