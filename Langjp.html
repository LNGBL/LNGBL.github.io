<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lang jp</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1220;
    --card: #1a1f36;
    --card2: #232947;
    --accent: #e63946;
    --accent2: #f77f00;
    --ok: #2a9d8f;
    --warn: #e9c46a;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --border: #2e3554;
  }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 16px;
    line-height: 1.6;
  }
  header {
    text-align: center;
    padding: 20px 10px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }
  header h1 {
    font-size: 28px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
  }
  header p {
    color: var(--muted);
    font-size: 16px;
    margin-top: 6px;
    direction: ltr;
  }
  .tabs {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .tab {
    padding: 10px 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    color: var(--text);
    font-size: 15px;
    transition: all 0.2s;
  }
  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
    font-weight: bold;
  }
  .tab:hover:not(.active) { background: var(--card2); }

  .page { display: none; max-width: 900px; margin: 0 auto; }
  .page.active { display: block; }

  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .panel h2 {
    font-size: 18px;
    margin-bottom: 14px;
    color: var(--accent2);
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .form-grid .full { grid-column: 1 / -1; }
  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input, select, textarea {
    width: 100%;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent2);
  }
  textarea { resize: vertical; min-height: 60px; }

  button {
    padding: 11px 20px;
    border: none;
    border-radius: 9px;
    cursor: pointer;
    font-size: 15px;
    font-family: inherit;
    font-weight: 600;
    transition: all 0.2s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #c92c38; }
  .btn-secondary { background: var(--card2); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { background: var(--border); }
  .btn-ok { background: var(--ok); color: #fff; }
  .btn-warn { background: var(--warn); color: #000; }
  .btn-sm { padding: 6px 12px; font-size: 13px; }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }

  /* Word list */
  .word-row {
    display: grid;
    grid-template-columns: 1fr 1fr auto auto;
    gap: 12px;
    align-items: center;
    padding: 12px;
    background: var(--card2);
    border-radius: 10px;
    margin-bottom: 8px;
    border: 1px solid var(--border);
  }
  .word-row .jp { font-size: 18px; font-weight: bold; }
  .word-row .fa { font-size: 15px; color: var(--muted); }
  .word-row .meta { font-size: 12px; color: var(--muted); }
  .word-row .btns { display: flex; gap: 6px; }
  .icon-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 14px;
  }
  .icon-btn:hover { background: var(--border); }

  .status-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: bold;
  }
  .badge-new { background: #475569; }
  .badge-learning { background: var(--warn); color: #000; }
  .badge-mastered { background: var(--ok); color: #fff; }
  .badge-review { background: var(--accent); }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 30px;
    font-size: 15px;
  }

  /* Flashcard */
  .flash-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .flashcard {
    width: 100%;
    max-width: 500px;
    height: 260px;
    background: linear-gradient(135deg, var(--card2), var(--card));
    border: 2px solid var(--border);
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    perspective: 1000px;
    text-align: center;
    padding: 20px;
  }
  .flashcard .question {
    font-size: 52px;
    font-weight: bold;
    color: #fff;
  }
  .flashcard .hint {
    margin-top: 12px;
    font-size: 14px;
    color: var(--muted);
  }
  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
    max-width: 500px;
  }
  .option {
    padding: 16px;
    background: var(--card2);
    border: 2px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    font-size: 16px;
    text-align: center;
    transition: all 0.2s;
    color: var(--text);
  }
  .option:hover:not(:disabled) { border-color: var(--accent2); }
  .option.correct { background: var(--ok); border-color: var(--ok); color: #fff; }
  .option.wrong { background: var(--accent); border-color: var(--accent); color: #fff; }
  .option:disabled { cursor: default; opacity: 0.85; }

  .progress-bar {
    width: 100%;
    max-width: 500px;
    height: 8px;
    background: var(--card2);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.3s;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .stat {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    text-align: center;
  }
  .stat .num { font-size: 24px; font-weight: bold; color: var(--accent2); }
  .stat .lbl { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .notice {
    padding: 10px 14px;
    border-radius: 9px;
    font-size: 14px;
    margin-bottom: 12px;
  }
  .notice-info { background: #1e3a5f; border: 1px solid #2c5c8f; }
  .notice-ok { background: #1e4d3f; border: 1px solid var(--ok); }
  .notice-warn { background: #4d3d1e; border: 1px solid var(--warn); }

  /* Modal */
  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  .modal-bg.active { display: flex; }
  .modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    max-width: 480px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h3 { margin-bottom: 14px; color: var(--accent2); }

  .sticker-preview {
    font-size: 40px;
    text-align: center;
    padding: 10px;
    background: var(--bg);
    border-radius: 10px;
    border: 1px dashed var(--border);
  }

  @media (max-width: 600px) {
    .form-grid { grid-template-columns: 1fr; }
    .word-row { grid-template-columns: 1fr 1fr; }
    .word-row .btns { grid-column: 1 / -1; justify-content: flex-end; }
    .options { grid-template-columns: 1fr; }
    .flashcard .question { font-size: 40px; }
  }
</style>
</head>
<body>

<header>
  <h1>Lang jp</h1>
  <p>言葉は、繰り返すほど、深くなる。</p>
</header>

<div class="tabs">
  <div class="tab active" data-page="add">➕ افزودن لغت</div>
  <div class="tab" data-page="list">📚 جدول لغات</div>
  <div class="tab" data-page="flash">🎴 فلش‌کارت</div>
  <div class="tab" data-page="stats">📊 آمار</div>
</div>

<!-- ================= ADD PAGE ================= -->
<div class="page active" id="page-add">
  <div class="panel">
    <h2>افزودن لغت جدید</h2>
    <div class="form-grid">
      <div>
        <label>کلمه ژاپنی *</label>
        <input type="text" id="in-jp" placeholder="مثلاً: 食べる" />
      </div>
      <div>
        <label>ترجمه فارسی *</label>
        <input type="text" id="in-fa" placeholder="مثلاً: خوردن" />
      </div>
      <div>
        <label>نوع کلمه *</label>
        <select id="in-type">
          <option value="اسم">اسم</option>
          <option value="فعل">فعل</option>
          <option value="صفت">صفت</option>
          <option value="قید">قید</option>
          <option value="حرف اضافه">حرف اضافه</option>
          <option value="ضمیر">ضمیر</option>
          <option value="عدد">عدد</option>
          <option value="اصطلاح">اصطلاح</option>
          <option value="کانجی">کانجی</option>
          <option value="سایر">سایر</option>
        </select>
      </div>
      <div>
        <label>استیکر / ایموجی (برای حفظ بهتر)</label>
        <input type="text" id="in-sticker" placeholder="🍎" maxlength="4" />
      </div>
    </div>
    <div class="actions">
      <button class="btn-primary" id="btn-add">ذخیره لغت</button>
      <button class="btn-secondary" id="btn-clear">پاک کردن فرم</button>
    </div>
    <div id="add-msg" style="margin-top:12px;"></div>
  </div>
</div>

<!-- ================= LIST PAGE ================= -->
<div class="page" id="page-list">
  <div class="panel">
    <h2>جدول لغات ذخیره‌شده</h2>
    <div class="actions" style="margin-bottom:14px;">
      <input type="text" id="search" placeholder="جستجو..." style="flex:1; min-width:180px;" />
      <button class="btn-secondary btn-sm" id="btn-reset-all">🔄 ریست همه</button>
    </div>
    <div id="word-list"></div>
  </div>
</div>

<!-- ================= FLASH PAGE ================= -->
<div class="page" id="page-flash">
  <div class="panel">
    <h2>فلش‌کارت تمرینی</h2>
    <div id="flash-info"></div>
    <div class="flash-wrap">
      <div class="progress-bar"><div class="progress-fill" id="flash-progress" style="width:0%"></div></div>
      <div class="flashcard" id="flashcard">
        <div class="question" id="flash-q">—</div>
        <div class="hint" id="flash-hint">برای شروع دکمه زیر را بزنید</div>
      </div>
      <div class="options" id="flash-options"></div>
      <div class="actions" style="justify-content:center;">
        <button class="btn-primary" id="btn-start-flash">🚀 شروع / ادامه تمرین</button>
        <button class="btn-secondary" id="btn-reset-progress">♻️ ریست پیشرفت</button>
      </div>
      <div id="flash-result"></div>
    </div>
  </div>
</div>

<!-- ================= STATS PAGE ================= -->
<div class="page" id="page-stats">
  <div class="panel">
    <h2>آمار و وضعیت یادگیری</h2>
    <div class="stats-grid" id="stats-grid"></div>
    <div id="stats-detail"></div>
  </div>
</div>

<!-- ================= EDIT MODAL ================= -->
<div class="modal-bg" id="modal-edit">
  <div class="modal">
    <h3>ویرایش لغت</h3>
    <input type="hidden" id="edit-id" />
    <div class="form-grid">
      <div>
        <label>کلمه ژاپنی</label>
        <input type="text" id="edit-jp" />
      </div>
      <div>
        <label>ترجمه فارسی</label>
        <input type="text" id="edit-fa" />
      </div>
      <div>
        <label>نوع کلمه</label>
        <select id="edit-type">
          <option value="اسم">اسم</option>
          <option value="فعل">فعل</option>
          <option value="صفت">صفت</option>
          <option value="قید">قید</option>
          <option value="حرف اضافه">حرف اضافه</option>
          <option value="ضمیر">ضمیر</option>
          <option value="عدد">عدد</option>
          <option value="اصطلاح">اصطلاح</option>
          <option value="کانجی">کانجی</option>
          <option value="سایر">سایر</option>
        </select>
      </div>
      <div>
        <label>استیکر</label>
        <input type="text" id="edit-sticker" maxlength="4" />
      </div>
    </div>
    <div class="actions">
      <button class="btn-primary" id="btn-save-edit">ذخیره</button>
      <button class="btn-secondary" id="btn-cancel-edit">انصراف</button>
    </div>
  </div>
</div>

<script>
/* =====================================================
   Lang jp - LocalStorage based Japanese vocabulary trainer
   منطق تثبیت:
   - هر روز فقط ۱۰ لغت
   - پاسخ درست < 5  => 48 ساعت تمرین مداوم، بعد مرحله بعد
   - 5 <= پاسخ درست < 7 => هر ۲۴ ساعت یکبار به مدت یک هفته
   - پاسخ درست >= 7 => پس از ۴۸ ساعت تکرار
   ===================================================== */

const STORAGE_KEY = 'langjp_words_v1';
const SESSION_KEY = 'langjp_session_v1';

/* ---------- Data Layer ---------- */
function loadWords() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch(e) { return []; }
}
function saveWords(words) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(words));
}
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

/* هر لغت:
{
  id, jp, fa, type, sticker,
  createdAt,           // timestamp
  // state machine
  stage: 'new' | 'learning' | 'review' | 'mastered',
  correctCount,        // در session جاری
  totalCorrect,
  totalWrong,
  nextReviewAt,        // timestamp
  // برای چرخه هفتگی
  weeklyStart,         // timestamp شروع هفته (اگر در حالت 24h)
  weeklyDaysDone,      // چند روز از ۷ روز انجام شده
  lastPracticeAt,
  // برای حالت سخت (<5)
  hardUntil,           // timestamp پایان 48h تمرین سخت
  hardSessions,        // تعداد جلسات تمرین سخت
}
*/

/* ---------- Session (روزانه) ---------- */
function todayKey() {
  const d = new Date();
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}
function loadSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return { date: todayKey(), practicedIds: [] };
    const s = JSON.parse(raw);
    if (s.date !== todayKey()) return { date: todayKey(), practicedIds: [] };
    return s;
  } catch(e) { return { date: todayKey(), practicedIds: [] }; }
}
function saveSession(s) {
  localStorage.setItem(SESSION_KEY, JSON.stringify(s));
}

/* ---------- Helpers ---------- */
const HOUR = 3600 * 1000;
const DAY = 24 * HOUR;

function now() { return Date.now(); }

function ensureWordDefaults(w) {
  if (w.stage === undefined) w.stage = 'new';
  if (w.correctCount === undefined) w.correctCount = 0;
  if (w.totalCorrect === undefined) w.totalCorrect = 0;
  if (w.totalWrong === undefined) w.totalWrong = 0;
  if (w.nextReviewAt === undefined) w.nextReviewAt = 0;
  if (w.weeklyStart === undefined) w.weeklyStart = 0;
  if (w.weeklyDaysDone === undefined) w.weeklyDaysDone = 0;
  if (w.lastPracticeAt === undefined) w.lastPracticeAt = 0;
  if (w.hardUntil === undefined) w.hardUntil = 0;
  if (w.hardSessions === undefined) w.hardSessions = 0;
  if (w.createdAt === undefined) w.createdAt = now();
  return w;
}

function isDue(w) {
  const t = now();
  if (w.stage === 'mastered') {
    return t >= w.nextReviewAt;
  }
  if (w.stage === 'new') return true;
  if (w.stage === 'learning') {
    // چرخه 24 ساعته هفتگی
    if (w.weeklyStart && w.weeklyDaysDone < 7) {
      // اگر 24 ساعت از آخرین تمرین گذشته باشد
      return t - w.lastPracticeAt >= DAY;
    }
    return true;
  }
  if (w.stage === 'review') {
    return t >= w.nextReviewAt;
  }
  return true;
}

function getDueWords(words) {
  const due = words.filter(isDue);
  // اولویت: جدیدها، بعد review
  due.sort((a, b) => {
    const order = { new: 0, learning: 1, review: 2, mastered: 3 };
    return order[a.stage] - order[b.stage];
  });
  return due;
}

/* ---------- Apply Answer Result (منطق تثبیت) ---------- */
function applyAnswerResult(w, isCorrect) {
  w.lastPracticeAt = now();

  if (isCorrect) {
    w.correctCount++;
    w.totalCorrect++;
  } else {
    w.totalWrong++;
  }

  // حالت جدید: بعد از اولین پاسخ
  if (w.stage === 'new') {
    w.stage = 'learning';
    w.correctCount = isCorrect ? 1 : 0;
    w.weeklyStart = now();
    w.weeklyDaysDone = 0;
    w.nextReviewAt = now() + DAY;
    return;
  }

  // در حالت learning: چرخه 24h هفتگی
  if (w.stage === 'learning') {
    // اگر امروز جواب داد، روز جدید را ثبت کن
    if (w.lastPracticeAt - (w.weeklyStart || 0) > 0) {
      // شمارش روزها بر اساس فاصله از شروع
    }
    if (isCorrect) {
      // روز موفق
    }
    // بررسی پایان هفته
    if (w.weeklyDaysDone >= 6) {
      // هفته تمام شد → بر اساس تعداد درست تصمیم بگیر
      evaluateWeeklyResult(w);
    } else {
      w.weeklyDaysDone++;
      w.nextReviewAt = now() + DAY;
    }
    return;
  }

  // در حالت review: تعیین سرنوشت بر اساس correctCount جاری
  if (w.stage === 'review') {
    evaluateWeeklyResult(w);
    return;
  }
}

function evaluateWeeklyResult(w) {
  // correctCount در session جاری (که در review ذخیره شده)
  const c = w.correctCount;

  if (c >= 7) {
    // عالی → 48 ساعت بعد تکرار، اما در state mastered
    w.stage = 'mastered';
    w.nextReviewAt = now() + 48 * HOUR;
    w.correctCount = 0;
    w.weeklyDaysDone = 0;
  } else if (c >= 5) {
    // متوسط → هر 24 ساعت یکبار به مدت یک هفته دیگر
    w.stage = 'learning';
    w.weeklyStart = now();
    w.weeklyDaysDone = 0;
    w.nextReviewAt = now() + DAY;
    w.correctCount = 0;
  } else {
    // ضعیف (<5) → ۴۸ ساعت تمرین مداوم، سپس مرحله بعد
    w.stage = 'learning';
    w.hardUntil = now() + 48 * HOUR;
    w.hardSessions = 0;
    w.nextReviewAt = now() + HOUR; // هر ساعت تمرین سخت
    w.correctCount = 0;
    w.weeklyDaysDone = 0;
  }
}

/* ---------- UI Rendering ---------- */
const pages = {
  add: document.getElementById('page-add'),
  list: document.getElementById('page-list'),
  flash: document.getElementById('page-flash'),
  stats: document.getElementById('page-stats'),
};

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    Object.values(pages).forEach(p => p.classList.remove('active'));
    pages[tab.dataset.page].classList.add('active');
    if (tab.dataset.page === 'list') renderList();
    if (tab.dataset.page === 'stats') renderStats();
    if (tab.dataset.page === 'flash') renderFlashInfo();
  });
});

/* ---------- Add Word ---------- */
document.getElementById('btn-add').addEventListener('click', () => {
  const jp = document.getElementById('in-jp').value.trim();
  const fa = document.getElementById('in-fa').value.trim();
  const type = document.getElementById('in-type').value;
  const sticker = document.getElementById('in-sticker').value.trim();

  const msg = document.getElementById('add-msg');
  if (!jp || !fa) {
    msg.innerHTML = '<div class="notice notice-warn">⚠️ کلمه ژاپنی و ترجمه فارسی الزامی است.</div>';
    return;
  }

  const words = loadWords();
  const w = ensureWordDefaults({
    id: uid(),
    jp, fa, type, sticker,
    stage: 'new',
    correctCount: 0,
    totalCorrect: 0,
    totalWrong: 0,
    nextReviewAt: 0,
    createdAt: now(),
  });
  words.push(w);
  saveWords(words);

  msg.innerHTML = '<div class="notice notice-ok">✅ لغت با موفقیت ذخیره شد.</div>';
  document.getElementById('in-jp').value = '';
  document.getElementById('in-fa').value = '';
  document.getElementById('in-sticker').value = '';
  setTimeout(() => msg.innerHTML = '', 2500);
});

document.getElementById('btn-clear').addEventListener('click', () => {
  document.getElementById('in-jp').value = '';
  document.getElementById('in-fa').value = '';
  document.getElementById('in-sticker').value = '';
  document.getElementById('add-msg').innerHTML = '';
});

/* ---------- List ---------- */
function renderList() {
  const words = loadWords().map(ensureWordDefaults);
  const q = (document.getElementById('search').value || '').trim().toLowerCase();
  const filtered = q
    ? words.filter(w => w.jp.toLowerCase().includes(q) || w.fa.toLowerCase().includes(q))
    : words;

  const container = document.getElementById('word-list');
  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty">📭 هیچ لغتی یافت نشد. از تب «افزودن لغت» شروع کنید.</div>';
    return;
  }

  container.innerHTML = filtered.map(w => {
    const badge = stageBadge(w);
    const dueTxt = dueText(w);
    return `
      <div class="word-row">
        <div>
          <div class="jp">${escapeHtml(w.sticker || '')} ${escapeHtml(w.jp)}</div>
          <div class="meta">${escapeHtml(w.type || '')} • ${dueTxt}</div>
        </div>
        <div>
          <div class="fa">${escapeHtml(w.fa)}</div>
          <div class="meta">${badge}</div>
        </div>
        <div class="btns">
          <button class="icon-btn" onclick="speakWord('${escapeAttr(w.jp)}')" title="پخش صوت">🔊</button>
          <button class="icon-btn" onclick="openEdit('${w.id}')" title="ویرایش">✏️</button>
          <button class="icon-btn" onclick="deleteWord('${w.id}')" title="حذف">🗑️</button>
        </div>
      </div>
    `;
  }).join('');
}

function stageBadge(w) {
  if (w.stage === 'new') return '<span class="status-badge badge-new">جدید</span>';
  if (w.stage === 'learning') {
    if (w.hardUntil && now() < w.hardUntil) {
      return '<span class="status-badge badge-review">تمرین سخت ۴۸ ساعته</span>';
    }
    return '<span class="status-badge badge-learning">در حال یادگیری (۲۴h)</span>';
  }
  if (w.stage === 'review') return '<span class="status-badge badge-review">مرور</span>';
  if (w.stage === 'mastered') return '<span class="status-badge badge-mastered">تثبیت‌شده</span>';
  return '';
}

function dueText(w) {
  if (w.stage === 'new') return 'آماده تمرین';
  if (w.stage === 'mastered') {
    const diff = w.nextReviewAt - now();
    if (diff <= 0) return 'آماده مرور';
    return 'مرور بعدی: ' + humanTime(diff) + ' دیگر';
  }
  if (w.stage === 'learning') {
    if (w.hardUntil && now() < w.hardUntil) {
      return 'تمرین سخت تا ' + humanTime(w.hardUntil - now());
    }
    const diff = w.nextReviewAt - now();
    if (diff <= 0) return 'آماده تمرین';
    return 'تمرین بعدی: ' + humanTime(diff) + ' دیگر';
  }
  return '';
}

function humanTime(ms) {
  if (ms <= 0) return 'حالا';
  const h = Math.floor(ms / HOUR);
  const m = Math.floor((ms % HOUR) / 60000);
  if (h >= 24) {
    const d = Math.floor(h / 24);
    return d + ' روز و ' + (h % 24) + ' ساعت';
  }
  if (h > 0) return h + ' ساعت و ' + m + ' دقیقه';
  return m + ' دقیقه';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) {
  return String(s).replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

/* ---------- TTS ---------- */
function speakWord(text) {
  if (!('speechSynthesis' in window)) {
    alert('مرورگر شما از پخش صوت پشتیبانی نمی‌کند.');
    return;
  }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  u.rate = 0.85;
  window.speechSynthesis.speak(u);
}

/* ---------- Edit / Delete ---------- */
function openEdit(id) {
  const words = loadWords().map(ensureWordDefaults);
  const w = words.find(x => x.id === id);
  if (!w) return;
  document.getElementById('edit-id').value = w.id;
  document.getElementById('edit-jp').value = w.jp;
  document.getElementById('edit-fa').value = w.fa;
  document.getElementById('edit-type').value = w.type || 'اسم';
  document.getElementById('edit-sticker').value = w.sticker || '';
  document.getElementById('modal-edit').classList.add('active');
}
document.getElementById('btn-cancel-edit').addEventListener('click', () => {
  document.getElementById('modal-edit').classList.remove('active');
});
document.getElementById('btn-save-edit').addEventListener('click', () => {
  const id = document.getElementById('edit-id').value;
  const jp = document.getElementById('edit-jp').value.trim();
  const fa = document.getElementById('edit-fa').value.trim();
  const type = document.getElementById('edit-type').value;
  const sticker = document.getElementById('edit-sticker').value.trim();
  if (!jp || !fa) { alert('کلمه ژاپنی و ترجمه الزامی است.'); return; }
  const words = loadWords().map(ensureWordDefaults);
  const idx = words.findIndex(x => x.id === id);
  if (idx === -1) return;
  words[idx].jp = jp;
  words[idx].fa = fa;
  words[idx].type = type;
  words[idx].sticker = sticker;
  saveWords(words);
  document.getElementById('modal-edit').classList.remove('active');
  renderList();
});

function deleteWord(id) {
  if (!confirm('این لغت حذف شود؟')) return;
  const words = loadWords().filter(x => x.id !== id);
  saveWords(words);
  renderList();
}

document.getElementById('btn-reset-all').addEventListener('click', () => {
  if (!confirm('همه لغات و پیشرفت حذف شوند؟')) return;
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(SESSION_KEY);
  renderList();
  renderStats();
  renderFlashInfo();
});

document.getElementById('search').addEventListener('input', renderList);

/* =====================================================
   FLASHCARD LOGIC
   ===================================================== */
let currentFlash = null; // { word, options: [], answered }

document.getElementById('btn-start-flash').addEventListener('click', startFlashSession);
document.getElementById('btn-reset-progress').addEventListener('click', () => {
  if (!confirm('پیشرفت فلش‌کارت ریست شود؟ (لغات حذف نمی‌شوند)')) return;
  const words = loadWords().map(ensureWordDefaults);
  words.forEach(w => {
    w.stage = 'new';
    w.correctCount = 0;
    w.totalCorrect = 0;
    w.totalWrong = 0;
    w.nextReviewAt = 0;
    w.weeklyStart = 0;
    w.weeklyDaysDone = 0;
    w.hardUntil = 0;
    w.hardSessions = 0;
    w.lastPracticeAt = 0;
  });
  saveWords(words);
  saveSession({ date: todayKey(), practicedIds: [] });
  currentFlash = null;
  renderFlashInfo();
  renderFlashResult('');
  alert('پیشرفت ریست شد.');
});

function startFlashSession() {
  const words = loadWords().map(ensureWordDefaults);
  if (words.length < 4) {
    renderFlashResult('<div class="notice notice-warn">⚠️ برای ساخت فلش‌کارت ۴ گزینه‌ای حداقل به ۴ لغت نیاز است. ابتدا لغت اضافه کنید.</div>');
    return;
  }

  const session = loadSession();
  // ۱۰ لغت در روز
  const due = getDueWords(words).filter(w => !session.practicedIds.includes(w.id));

  if (due.length === 0) {
    // اگر لغت due نبود، از همه لغات (به جز تمرین‌شده‌های امروز) انتخاب کن
    const remaining = words.filter(w => !session.practicedIds.includes(w.id));
    if (remaining.length === 0) {
      renderFlashResult('<div class="notice notice-ok">🎉 تمرین امروز کامل شد! فردا برگرد.</div>');
      return;
    }
    nextFlash(remaining[0], words);
    return;
  }

  // محدودیت ۱۰ لغت در روز
  const dailyLimit = 10;
  const remainingToday = dailyLimit - session.practicedIds.length;
  if (remainingToday <= 0) {
    renderFlashResult('<div class="notice notice-ok">🎉 سهم امروز (۱۰ لغت) کامل شد! فردا ادامه بده.</div>');
    return;
  }

  const pick = due[0];
  nextFlash(pick, words);
}

function nextFlash(word, allWords) {
  const distractors = allWords
    .filter(w => w.id !== word.id)
    .sort(() => Math.random() - 0.5)
    .slice(0, 3);

  const options = [word, ...distractors].sort(() => Math.random() - 0.5);

  currentFlash = {
    word,
    options: options.map(o => ({ id: o.id, fa: o.fa, jp: o.jp })),
    answered: false,
  };

  renderFlashCard();
}

function renderFlashCard() {
  if (!currentFlash) return;
  const { word, options } = currentFlash;

  document.getElementById('flash-q').textContent = (word.sticker || '') + ' ' + word.jp;
  document.getElementById('flash-hint').textContent = 'ترجمه صحیح را انتخاب کن • ' + (word.type || '');

  const optContainer = document.getElementById('flash-options');
  optContainer.innerHTML = options.map(o => `
    <button class="option" data-id="${o.id}" onclick="answerFlash('${o.id}')">${escapeHtml(o.fa)}</button>
  `).join('');
}

function answerFlash(id) {
  if (!currentFlash || currentFlash.answered) return;
  currentFlash.answered = true;

  const isCorrect = id === currentFlash.word.id;
  const btns = document.querySelectorAll('#flash-options .option');
  btns.forEach(b => {
    b.disabled = true;
    if (b.dataset.id === currentFlash.word.id) b.classList.add('correct');
    if (b.dataset.id === id && !isCorrect) b.classList.add('wrong');
  });

  // ذخیره نتیجه در localStorage
  const words = loadWords().map(ensureWordDefaults);
  const idx = words.findIndex(w => w.id === currentFlash.word.id);
  if (idx !== -1) {
    applyAnswerResult(words[idx], isCorrect);
    saveWords(words);

    // ثبت در session روزانه
    const session = loadSession();
    if (!session.practicedIds.includes(words[idx].id)) {
      session.practicedIds.push(words[idx].id);
    }
    saveSession(session);
  }

  // پیام نتیجه
  const res = document.getElementById('flash-result');
  if (isCorrect) {
    res.innerHTML = '<div class="notice notice-ok">✅ درست! آفرین.</div>';
  } else {
    res.innerHTML = `<div class="notice notice-warn">❌ اشتباه. پاسخ درست: <b>${escapeHtml(currentFlash.word.fa)}</b></div>`;
  }

  // پخش صوت کلمه ژاپنی
  speakWord(currentFlash.word.jp);

  // دکمه ادامه
  setTimeout(() => {
    const cont = document.createElement('div');
    cont.style.marginTop = '12px';
    cont.style.textAlign = 'center';
    cont.innerHTML = '<button class="btn-primary" onclick="startFlashSession()">ادامه ➡️</button>';
    res.appendChild(cont);
  }, 200);
}

function renderFlashResult(html) {
  document.getElementById('flash-result').innerHTML = html;
}

function renderFlashInfo() {
  const words = loadWords().map(ensureWordDefaults);
  const session = loadSession();
  const due = getDueWords(words).filter(w => !session.practicedIds.includes(w.id));
  const todayLeft = Math.max(0, 10 - session.practicedIds.length);
  const container = document.getElementById('flash-info');
  container.innerHTML = `
    <div class="stats-grid" style="margin-bottom:14px;">
      <div class="stat"><div class="num">${words.length}</div><div class="lbl">کل لغات</div></div>
      <div class="stat"><div class="num">${due.length}</div><div class="lbl">آماده تمرین</div></div>
      <div class="stat"><div class="num">${session.practicedIds.length}</div><div class="lbl">تمرین‌شده امروز</div></div>
      <div class="stat"><div class="num">${todayLeft}</div><div class="lbl">باقی‌مانده امروز</div></div>
    </div>
  `;
}

/* =====================================================
   STATS PAGE
   ===================================================== */
function renderStats() {
  const words = loadWords().map(ensureWordDefaults);
  const session = loadSession();

  const counts = { new: 0, learning: 0, review: 0, mastered: 0 };
  words.forEach(w => { if (counts[w.stage] !== undefined) counts[w.stage]++; });

  const grid = document.getElementById('stats-grid');
  grid.innerHTML = `
    <div class="stat"><div class="num">${words.length}</div><div class="lbl">کل لغات</div></div>
    <div class="stat"><div class="num">${counts.new}</div><div class="lbl">جدید</div></div>
    <div class="stat"><div class="num">${counts.learning}</div><div class="lbl">در حال یادگیری</div></div>
    <div class="stat"><div class="num">${counts.review}</div><div class="lbl">مرور</div></div>
    <div class="stat"><div class="num">${counts.mastered}</div><div class="lbl">تثبیت‌شده</div></div>
    <div class="stat"><div class="num">${session.practicedIds.length}</div><div class="lbl">تمرین امروز</div></div>
  `;

  const detail = document.getElementById('stats-detail');
  if (words.length === 0) {
    detail.innerHTML = '<div class="empty">هنوز لغتی ذخیره نشده.</div>';
    return;
  }

  const rows = words.map(w => `
    <div class="word-row">
      <div>
        <div class="jp">${escapeHtml(w.sticker || '')} ${escapeHtml(w.jp)}</div>
        <div class="meta">${escapeHtml(w.fa)}</div>
      </div>
      <div>
        <div class="meta">درست: ${w.totalCorrect} | غلط: ${w.totalWrong}</div>
        <div class="meta">${stageBadge(w)}</div>
      </div>
      <div></div>
    </div>
  `).join('');
  detail.innerHTML = '<h2 style="margin:16px 0 10px;">جزئیات</h2>' + rows;
}

/* =====================================================
   INIT
   ===================================================== */
(function init() {
  // migrate defaults
  const words = loadWords().map(ensureWordDefaults);
  saveWords(words);
  renderList();
  renderFlashInfo();
  renderStats();
})();

/* expose globals for inline handlers */
window.speakWord = speakWord;
window.openEdit = openEdit;
window.deleteWord = deleteWord;
window.answerFlash = answerFlash;
window.startFlashSession = startFlashSession;
</script>
</body>
</html>
